extend-exclude = [
  "*.lock",
  # The CC0 legal code, as Creative Commons publishes it.
  "LICENSE",
  # Other people's data, committed as published.
  "data/upstream/",
  # Public-domain books as written, in the parity text lists.
  "crates/parity/texts/en-gb-holmes.txt",
  "crates/parity/texts/en-us-sawyer.txt",
  "crates/parity/texts/zh-luxun.txt",
  "crates/parity/texts/es-galdos.txt",
