# typos checks spelling in code and docs, in UK English. Every allowed word below says why it is
# allowed.

[default]
locale = "en-gb"

[default.extend-words]
# Phonetics: a formant is a resonance of the vocal tract (and a kind of speech synthesiser).
formant = "formant"
# CMUdict's ARPAbet phone names (IY is the vowel of "fleece").
iy = "iy"
# Croatian "from", in a book title (docs/data-sources.md).
iz = "iz"
# The English suffix -ded (folded, landed), named in rules and tests.
ded = "ded"
# The English suffixes -ful and -ment, in the morphology rules.
ful = "ful"
ment = "ment"
# The ordinal suffix of 2nd and 22nd.
nd = "nd"
# IPA in tests that reads like a word: jus is "use" (the noun).
jus = "jus"
# American spellings that jespersen must recognise, named as examples in the docs and tests.
color = "color"
airplane = "airplane"
anemia = "anemia"
catalog = "catalog"
center = "center"
defense = "defense"
maneuver = "maneuver"
mold = "mold"
pajama = "pajama"
plow = "plow"
realize = "realize"
skeptic = "skeptic"
traveled = "traveled"
kilometer = "kilometer"
# Spelling fragments the British rules match: suffixes (-ises, -yse) and the stem advantag-.
ises = "ises"
yse = "yse"
# Verse's elisions, spelt with an apostrophe the checker splits at (lov'd, giv'n, heav'nly).
lov = "lov"
giv = "giv"
nly = "nly"
advantag = "advantag"
# Mandarin syllables in pinyin, in the rules and tests: fo (佛), and ue, written for üe after n and l.
fo = "fo"
ue = "ue"
# Spanish words in the Spanish crate's rules and docs (calle, the abbreviations profesor and aprox.).
calle = "calle"
doble = "doble"
mis = "mis"
tema = "tema"
programa = "programa"
profesor = "profesor"
aprox = "aprox"
fiel = "fiel"
ser = "ser"
# Italian words in the Italian crate's rules and docs (tre, the articles allo and alle).
tre = "tre"
allo = "allo"
alle = "alle"
# The Turkish present suffix -yor, named in the docs.
yor = "yor"
# French words named in the docs (fils, fille).
fils = "fils"
fille = "fille"

