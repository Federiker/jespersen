# Developer tools, pinned (the same versions as jerome's). `mise install` installs them;
# scripts/install.bat and scripts/install.sh set up a whole machine.
# Rust itself is pinned in rust-toolchain.toml and installed by rustup.
min_version = "2026.10.0"

[settings]
# mise.lock records each tool's exact version and checksums.
lockfile = true

[tools]
# Lets the `cargo:` tools below install prebuilt binaries instead of compiling.
cargo-binstall = "1.26.0"
"cargo:cargo-nextest" = "0.9.149"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-llvm-cov" = "0.9.1"
cargo-deny = "0.20.2"
typos = "1.51.1"
lychee = "0.24.2"
lefthook = "2.2.2"

# The repository's commands: `mise run <task>` (`mise tasks` lists them). Arguments after the
# task's name are passed on, e.g. `mise run test -p jespersen_cli`.

# Develop.
[tasks.clean]
description = "Remove build outputs"
run = "cargo clean"

[tasks.fix]
description = "Format the Rust code"
run = "cargo fmt --all"

# Check.
[tasks.check]
description = "cargo check of the workspace, and of the library with no language and with each alone"
run = [
  "cargo check --workspace --all-targets",
  "cargo check -p jespersen --no-default-features",
  "cargo check -p jespersen --no-default-features --features en",
  "cargo check -p jespersen --no-default-features --features zh",
]

[tasks.fmt]
description = "Check the Rust formatting"
run = "cargo fmt --all --check"

[tasks.clippy]
description = "Clippy, warnings denied"
run = "cargo clippy --workspace --all-targets -- --deny warnings"

[tasks.spell]
description = "Spelling (typos.toml)"
run = "typos"

[tasks.links]
description = "Broken links in the Markdown files (lychee.toml)"
run = "lychee --no-progress README.md AGENTS.md CLAUDE.md TODO.md docs data/README.md"

[tasks.machete]
description = "Unused Rust dependencies"
run = "cargo machete"

[tasks.deny]
description = "Licences, bans and sources (advisories run weekly in CI)"
run = "cargo deny check licenses bans sources"

[tasks.audit]
description = "Advisories, licences, bans and sources"
run = "cargo deny check"

# Test.
[tasks.test]
description = "The tests, with nextest"
run = "cargo nextest run --workspace"

[tasks.coverage]
description = "The tests, at 80% coverage or more (CI adds --profile ci)"
run = "cargo llvm-cov nextest --workspace --fail-under-lines 80 --fail-under-regions 80"

