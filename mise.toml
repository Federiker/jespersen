# Generate language data (committed; see data/README.md).
[tasks."en:letters"]
description = "Learn the American English letter-to-sound rules from CMUdict"
run = "cargo run --release -q -p jespersen_lang_en --bin jespersen-train-en -- write data/derived/en-us/letters.tsv"

[tasks."en:letters:evaluate"]
description = "How well the learned rules read words held out of training"
run = "cargo run --release -q -p jespersen_lang_en --bin jespersen-train-en -- evaluate"

# Unihan is not committed: download Unihan.zip (pinned in data/upstream/sources.toml), unpack it and
# pass Unihan_Readings.txt: `mise run zh:characters -- path/to/Unihan_Readings.txt`.
[tasks."zh:characters"]
description = "Extract each Chinese character's Mandarin reading from Unihan"
run = "cargo run --release -q -p jespersen_lang_zh --bin jespersen-unihan-zh -- data/derived/zh/characters.tsv"

# NST's lexicons are not committed: download the language's archive (pinned in
# data/upstream/sources.toml), unpack it (`tar -xzf`) and pass its .pron file, for example
# `mise run data:nst:da -- path/to/dan030224NST.pron`.
[tasks."data:nst:da"]
description = "Extract the Danish words and pronunciations from NST's lexicon"
run = "cargo run --release -q -p jespersen_nst -- da data/derived/da/nst.tsv"

[tasks."data:nst:sv"]
description = "Extract the Swedish words NST transcribed by hand from its lexicon"
run = "cargo run --release -q -p jespersen_nst -- sv data/derived/sv/nst.tsv"

[tasks."data:nst:nb"]
description = "Extract the Bokmål words NST transcribed by hand from its lexicon"
run = "cargo run --release -q -p jespersen_nst -- nb data/derived/nb/nst.tsv"

# What CI's Checks workflow runs, in its order: the quick checks first, so they fail fast.
[tasks.ci]
description = "Every check CI runs"
run = [
  { tasks = ["fmt", "spell", "links"] },
  { tasks = ["machete", "deny"] },
  { task = "clippy" },
  { task = "coverage" },
]
