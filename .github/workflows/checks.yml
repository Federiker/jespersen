name: Checks

# Pushes to main and every pull request run the checks on Linux (a branch with a pull request runs
# once); a manual run chooses the platforms. Security advisories run weekly in advisories.yml, so a
# new advisory never fails an unrelated push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to check
        type: choice
        required: true
        default: all
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: read

# A newer push to the same branch or pull request cancels its older run; manual runs are kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux for pushes and pull requests; the chosen platforms for a manual run.
        os: >-
          ${{ fromJSON(
            github.event_name != 'workflow_dispatch' && '["ubuntu-latest"]' ||
            inputs.platform == 'windows' && '["windows-latest"]' ||
            inputs.platform == 'macos' && '["macos-latest"]' ||
            inputs.platform == 'linux' && '["ubuntu-latest"]' ||
            '["windows-latest", "macos-latest", "ubuntu-latest"]'
          ) }}
    steps:
      - uses: actions/checkout@v4
      # The tools pinned in mise.toml; `mise run` runs its tasks (`mise run ci` runs these steps locally).
      - uses: jdx/mise-action@v5
      # The Rust toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Quick checks first.
      - run: mise run fmt
      - run: mise run spell
      - run: mise run links
      - run: mise run machete
      - run: mise run deny
      # Then the build and the tests.
      - run: mise run clippy
      # The library also builds without any language feature, and with each alone (decision 11).
      - run: mise run check
      # The tests, with coverage at 80% or more. nextest does not run doctests; the workspace has
      # none (run `cargo test --workspace --doc` too if that changes).
      - run: mise run coverage -- --profile ci
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}
          path: target/llvm-cov-target/nextest/ci/junit.xml
          if-no-files-found: ignore
